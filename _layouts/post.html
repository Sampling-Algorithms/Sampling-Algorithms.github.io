---
layout: default
---

<article class="post-layout">
	{{ content }}
</article>

<style>
	.post-layout {
		max-width: 100%;
		margin: 2rem auto 0;
		padding: 2rem;
		background: var(--page-bg-alt);
		border-radius: 20px;
		box-shadow: 0 8px 32px rgba(58, 143, 183, 0.12);
	}

	.post-layout h1,
	.post-layout h2,
	.post-layout h3 {
		color: var(--text-primary);
	}

	.post-layout p,
	.post-layout li {
		color: var(--text-secondary);
	}

    .post-layout ul,
    .post-layout ol {
    margin: 0.7rem 0 1rem 0.9rem;
    padding-left: 1.5rem;
    }

    .post-layout li {
    margin: 0.15rem 0;
    }

	@media (max-width: 768px) {
		.post-layout {
			border-radius: 0;
			margin-top: 0;
			padding: 1.25rem;
		}
	}
</style>
